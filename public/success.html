<!doctype html>
<html lang="sk">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <meta name="robots" content="noindex,nofollow">
 <title>Overenie platby • Medlove</title>
 <script src="theme.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
 <main class="shell section" style="max-width:660px;text-align:center">
  <div style="font-size:66px">🍯</div>
  <h1>Ďakujeme za objednávku!</h1>
  <p id="paymentMessage" role="status" aria-live="polite">Overujeme platbu cez Stripe. Počkaj, prosím.</p>
  <p id="orderCode"></p>
  <a class="btn btn-secondary hidden" id="successTrackLink" href="sledovanie.html" rel="noreferrer">Sledovať objednávku</a>
  <a class="btn btn-primary" href="index.html">Späť do obchodu</a>
 </main>
 <script src="config.js"></script>
 <script>
 (async function(){
  const params=new URLSearchParams(location.search);
  const code=params.get('order'),token=params.get('token');
  if(token&&/^[a-f0-9]{64}$/.test(token)){
   const link=document.getElementById('successTrackLink');
   link.href='sledovanie.html?token='+encodeURIComponent(token);link.classList.remove('hidden');
  }
  const message=document.getElementById('paymentMessage');
  if(!code||!/^MED-[A-F0-9]{12}$/.test(code)){
   message.textContent='Chýba platné číslo objednávky. Kontaktuj nás, ak už platba prebehla.';
   return;
  }
  document.getElementById('orderCode').textContent='Číslo objednávky: '+code;
  const api=window.MEDLOVE_CONFIG?.apiBaseUrl;
  if(!api||api.includes('REPLACE_WITH_RENDER_URL')){
   message.textContent='Overenie platby nie je momentálne dostupné. Ak si zaplatil, objednávku neopakuj.';
   return;
  }
  for(let attempt=0;attempt<5;attempt++){
   try{
    const response=await fetch(api+'/api/orders/'+encodeURIComponent(code)+'/payment-status',{cache:'no-store'});
    if(!response.ok)throw Error('Overenie momentálne nedostupné');
    const data=await response.json();
    if(data.payment_status==='paid'){
     message.textContent='Platba bola úspešne potvrdená. Objednávku pripravíme na vybavenie.';
     return;
    }
    if(data.payment_status==='failed'||data.payment_status==='refunded'){
     message.textContent='Platbu sa nepodarilo potvrdiť. Ak ti boli peniaze strhnuté, neplať znova a kontaktuj nás.';
     return;
    }
    message.textContent='Platba sa ešte overuje. Neodosielaj novú platbu, kým sa overenie nedokončí.';
   }catch(err){
    message.textContent='Overenie platby sa momentálne nepodarilo. Ak ti boli peniaze strhnuté, neplať znova; kontaktuj nás s číslom objednávky.';
   }
   if(attempt<4)await new Promise(resolve=>setTimeout(resolve,3000));
  }
 })();
 </script>
</body>
</html>
